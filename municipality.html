<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAPS KZN · Municipality share</title>
<style>
  body { margin: 0; background: #f2f2f7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #1c1c1e; }
  header { padding: 16px; background: #1c1c1e; color: #fff; }
  .pad { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 12px; margin: 10px 0; }
  .cas { color: #8e8e93; font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<header><b>UNSAFE AREAS · SHARE WITH MUNICIPALITY</b></header>
<div class="pad" id="list"><p>None yet.</p></div>
<script>
async function load() {
  const all = await (await fetch("/api/reports")).json();
  const areas = all.filter(c => c.kind === "area");
  document.getElementById("list").innerHTML = areas.length ? areas.map(c => `<div class="card"><div class="cas">${c.cas}</div><b>${c.label}</b><div>${c.address || "place not given"}</div><div>Not a case. Police can share this with the municipality.</div></div>`).join("") : "<p>None yet.</p>";
}
load();
setInterval(load, 2000);
</script>
</body>
</html>
