<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAPS KZN · Flying Squad</title>
<style>
  body { margin: 0; background: #140c0c; color: #f6ecec; font-family: "Segoe UI", sans-serif; }
  header { padding: 14px 16px; background: #3b0d12; border-bottom: 3px solid #d4af37; display: flex; justify-content: space-between; }
  a { color: #d4af37; font-size: 13px; }
  .pad { padding: 16px; }
  .card { background: #241416; border: 1px solid rgba(255,255,255,.1); padding: 12px; margin: 10px 0; }
  .cas { color: #d4af37; font-family: Consolas, monospace; }
  .fine { color: #c9a8a8; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div><b>FLYING SQUAD · KZN</b><div class="fine">Receives only what the provincial desk refers. Own door. Own log.</div></div>
  <a href="/desk">Back to SAPS desk</a>
</header>
<div class="pad" id="list"><p class="fine">No file referred yet. Drag a case on the desk onto Flying Squad.</p></div>
<script>
async function load() {
  const reports = await (await fetch("/api/reports")).json();
  const mine = reports.filter(c => c.desk === "flying");
  const box = document.getElementById("list");
  if (!mine.length) return;
  box.innerHTML = mine.map(c => `<div class="card"><div class="cas">${c.cas}</div><b>${c.label}</b> · ${c.cluster}<div class="fine">${c.named ? c.name + " · " + c.mobile + " · " + c.address : "No name"}</div><div class="fine">${(c.log || []).join(" · ")}</div></div>`).join("");
}
load();
setInterval(load, 2000);
</script>
</body>
</html>
