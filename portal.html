<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAPS KZN · Receiving desk</title>
<style>
  body { margin: 0; background: #10141c; color: #e7edf6; font-family: "Segoe UI", sans-serif; }
  header { padding: 14px 16px; background: #0a1730; border-bottom: 3px solid #d4af37; display: flex; justify-content: space-between; }
  a { color: #d4af37; font-size: 13px; }
  .pad { padding: 16px; max-width: 720px; }
  .card { background: #121c30; border: 1px solid rgba(255,255,255,.1); padding: 12px; margin: 10px 0; }
  .cas { color: #d4af37; font-family: Consolas, monospace; }
  .fine { color: #93a4bd; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div><b id="title">RECEIVING DESK</b><div class="fine">Own link. Sees only what the provincial desk referred here.</div></div>
  <a href="/desk">Back to SAPS desk</a>
</header>
<div class="pad" id="list"><p class="fine">Nothing referred yet.</p></div>
<script>
const desk = new URLSearchParams(location.search).get("desk") || location.pathname.replace("/", "") || "flying";
const names = { flying: "FLYING SQUAD", cluster: "CLUSTER RADIO", station: "STATION SECTOR", fcs: "FCS DESK", hold: "HOLD", ems: "EMS", durban: "DURBAN CENTRAL STATION", umlazi: "UMLAZI STATION", chatsworth: "CHATSWORTH STATION", pmb: "PIETERMARITZBURG CENTRAL", richards: "RICHARDS BAY STATION" };
document.getElementById("title").textContent = names[desk] || desk.toUpperCase();
document.title = "SAPS KZN · " + (names[desk] || desk);
async function load() {
  const reports = await (await fetch("/api/reports")).json();
  const mine = reports.filter(c => c.desk === desk);
  const box = document.getElementById("list");
  box.innerHTML = mine.length ? mine.map(c => `<div class="card"><div class="cas">${c.cas}</div><b>${c.label}</b> · ${c.cluster}<div class="fine">${c.named ? c.name + " · " + c.mobile + " · " + c.address : "No name. No callback."}</div><div class="fine">${(c.log || []).join(" · ")}</div></div>`).join("") : "<p class='fine'>Nothing on this desk yet. Refer a file from the provincial desk.</p>";
}
load();
setInterval(load, 2000);
</script>
</body>
</html>
