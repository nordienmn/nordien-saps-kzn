<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAPS KZN · Daily brief</title>
<style>
  body { margin: 0; background: #f2f2f7; color: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  header { padding: 16px; background: #1c1c1e; color: #fff; display: flex; justify-content: space-between; }
  a { color: #ffd60a; }
  .pad { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; margin: 10px 0; }
  h2 { margin: 0 0 6px; font-size: 18px; }
  .fine { color: #8e8e93; font-size: 13px; }
</style>
</head>
<body>
<header><b>DAILY BRIEF</b><a href="/commissioner">Commissioner</a></header>
<div class="pad" id="out"><p class="fine">Reading the files…</p></div>
<script>
async function load() {
  const reports = await (await fetch("/api/reports")).json();
  const names = [...new Set(reports.filter(c => c.named && c.name).map(c => c.name))];
  const places = [...new Set(reports.map(c => c.address || c.cluster).filter(Boolean))];
  const crimes = {};
  const clusters = {};
  reports.forEach(c => {
    crimes[c.label] = (crimes[c.label] || 0) + 1;
    clusters[c.cluster] = (clusters[c.cluster] || 0) + 1;
  });
  const tips = reports.filter(c => c.kind === "tip");
  document.getElementById("out").innerHTML = `
    <div class="card"><h2>Today</h2><p>${reports.length} reports in. ${reports.length - tips.length} cases. ${tips.length} tip-offs.</p></div>
    <div class="card"><h2>This week</h2><p>${reports.length} total. ${tips.filter(c => c.status === "referred").length} tips escalated. ${tips.filter(c => !c.verified).length} tips not acted on.</p></div>
    <div class="card"><h2>Names saved</h2><p>${names.join(", ") || "None on a named file."}</p><p class="fine">Anonymous names are not stored.</p></div>
    <div class="card"><h2>Places</h2><p>${places.join(" · ") || "None"}</p></div>
    <div class="card"><h2>Crimes</h2><p>${Object.entries(crimes).map(([k, v]) => k + " " + v).join(" · ")}</p></div>
    <div class="card"><h2>Clusters</h2><p>${Object.entries(clusters).map(([k, v]) => k + " " + v).join(" · ")}</p></div>`;
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
