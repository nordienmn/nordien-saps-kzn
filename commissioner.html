<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAPS KZN · Commissioner</title>
<style>
  body { margin: 0; background: #07101c; color: #e7edf6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  header { padding: 14px 16px; background: #0a1730; border-bottom: 3px solid #d4af37; display: flex; justify-content: space-between; }
  a { color: #d4af37; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 16px; }
  .kpi { background: #121c30; border-bottom: 3px solid #d4af37; padding: 12px; }
  .kpi b { display: block; font-size: 26px; }
  .flash { background: #8f1d24; animation: pulse 1s infinite; border-radius: 12px; padding: 12px; margin: 0 16px; }
  @keyframes pulse { 50% { opacity: .55; } }
  .card { background: #121c30; margin: 8px 16px; padding: 10px; border-radius: 10px; }
  .cas { color: #d4af37; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header><b>COMMISSIONER · KZN</b><a href="/desk">Desk</a></header>
<div class="kpis">
  <div class="kpi"><b id="all">0</b><span>All received</span></div>
  <div class="kpi"><b id="cases">0</b><span>Cases</span></div>
  <div class="kpi"><b id="tips">0</b><span>Anonymous</span></div>
  <div class="kpi"><b id="red">0</b><span>Referred up</span></div>
</div>
<div id="flash"></div>
<div id="list"></div>
<script>
async function load() {
  const reports = await (await fetch("/api/reports")).json();
  const referred = reports.filter(c => c.kind === "tip" && c.desk === "commissioner");
  document.getElementById("all").textContent = reports.length;
  document.getElementById("cases").textContent = reports.filter(c => c.kind !== "tip").length;
  document.getElementById("tips").textContent = reports.filter(c => c.kind === "tip").length;
  document.getElementById("red").textContent = referred.length;
  document.getElementById("flash").innerHTML = referred.map(c => `<div class="flash">RED · ${c.cas} · ${c.label} · referred by head office</div>`).join("");
  document.getElementById("list").innerHTML = reports.map(c => `<div class="card"><div class="cas">${c.cas}</div>${c.kind === "tip" ? "TIP" : "FILE"} · ${c.label} · ${c.officer || "no officer yet"}</div>`).join("");
}
load();
setInterval(load, 2000);
</script>
</body>
</html>
