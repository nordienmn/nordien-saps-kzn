<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAPS KZN · Desk</title>
<style>
  body { margin: 0; background: #0b1220; color: #e8eef8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #0a1730; border-bottom: 1px solid rgba(212,175,55,.5); }
  .brand { display: flex; gap: 10px; align-items: center; }
  .brand img { width: 42px; height: 42px; background: #fff; border-radius: 50%; }
  .brand b { letter-spacing: .06em; font-size: 13px; } a { color: #d4af37; font-size: 12px; margin-left: 12px; }
  .desk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px; }
  .col { background: #121c30; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 10px; min-height: 70vh; }
  .col h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #d4af37; }
  .signin input, .signin select { width: 100%; padding: 10px; margin: 6px 0; border: 0; border-radius: 8px; font-family: inherit; }
  .signin button, .card button { width: 100%; border: 0; background: #1e4f9a; color: #fff; padding: 10px; border-radius: 8px; font-weight: 700; }
  .card { background: #0b1220; border: 1px solid rgba(255,255,255,.1); padding: 8px; margin: 8px 0; }
  .cas { color: #d4af37; font-family: ui-monospace, monospace; font-size: 12px; }
  .fine { color: #93a4bd; font-size: 12px; }
  .bad { color: #e15b64; font-size: 12px; display: none; }
  @media (max-width: 900px) { .desk { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand"><img alt="SAPS" src="/static/badge.png" /><div><b>SOUTH AFRICAN POLICE SERVICE · DESK</b><div class="fine">One desk. Four doors.</div></div></div>
  <div><a href="/commissioner">Senior leadership</a></div>
</header>
<div class="desk">
  <section class="col" id="col-calls">
    <h2>Call operators</h2>
    <div class="signin" id="in-calls">
      <input id="id-calls" placeholder="Officer ID" value="CALL-01" />
      <input id="pw-calls" type="password" placeholder="Password" value="0000" />
      <button type="button" onclick="sign('calls')">Enter</button>
      <p class="bad" id="bad-calls">Password is 0000.</p>
    </div>
    <div id="out-calls"></div>
  </section>
  <section class="col" id="col-crime">
    <h2>Crime reporting</h2>
    <div class="signin" id="in-crime">
      <input id="id-crime" placeholder="Officer ID" value="CRIME-01" />
      <input id="pw-crime" type="password" placeholder="Password" value="0000" />
      <button type="button" onclick="sign('crime')">Enter</button>
      <p class="bad" id="bad-crime">Password is 0000.</p>
    </div>
    <div id="out-crime"></div>
  </section>
  <section class="col" id="col-gbv">
    <h2>GBV</h2>
    <div class="signin" id="in-gbv">
      <input id="id-gbv" placeholder="Officer ID" value="GBV-01" />
      <input id="pw-gbv" type="password" placeholder="Password" value="0000" />
      <button type="button" onclick="sign('gbv')">Enter</button>
      <p class="bad" id="bad-gbv">Password is 0000.</p>
    </div>
    <div id="out-gbv"></div>
  </section>
  <section class="col" id="col-anon">
    <h2>Anonymous</h2>
    <div class="signin" id="in-anon">
      <input id="id-anon" placeholder="Officer ID" value="TIP-01" />
      <input id="pw-anon" type="password" placeholder="Password" value="0000" />
      <button type="button" onclick="sign('anon')">Enter</button>
      <p class="bad" id="bad-anon">Password is 0000.</p>
    </div>
    <div id="out-anon"></div>
  </section>
</div>
<script>
const open = { calls: false, crime: false, gbv: false, anon: false };
const who = {};
function sign(door) {
  if (document.getElementById("pw-" + door).value !== "0000") {
    document.getElementById("bad-" + door).style.display = "block";
    return;
  }
  open[door] = true;
  who[door] = document.getElementById("id-" + door).value || door.toUpperCase();
  document.getElementById("in-" + door).style.display = "none";
  load();
}
async function load() {
  const all = await (await fetch("/api/reports")).json();
  paint("calls", all.filter(c => c.label === "Voice call" || c.label === "Video call" || c.call));
  paint("crime", all.filter(c => c.kind !== "tip" && c.kind !== "area" && c.label !== "GBV" && c.label !== "GBV SOS" && c.label !== "Voice call" && c.label !== "Video call"));
  paint("gbv", all.filter(c => c.label === "GBV" || c.label === "GBV SOS"));
  paint("anon", all.filter(c => c.kind === "tip"));
}
function paint(door, items) {
  if (!open[door]) return;
  const box = document.getElementById("out-" + door);
  box.innerHTML = items.length ? items.map(c => `<div class="card"><div class="cas">${c.cas}</div><b>${c.label}</b><div class="fine">${c.named ? c.name : "no name"} · ${c.address || c.cluster || ""}</div><div class="fine">${c.transcript || c.note || ""}</div>${door === "anon" ? `<button onclick="up('${c.id}')">Escalate to senior leadership</button>` : ""}${door === "gbv" ? `<button onclick="ref('${c.id}','hospital')">Hospital</button><button onclick="ref('${c.id}','social worker')">Social worker</button>` : ""}</div>`).join("") : "<p class='fine'>Nothing in this section.</p>";
}
async function up(id) {
  await fetch("/api/route/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ desk: "commissioner", officer: who.anon, log: who.anon + " escalated to senior leadership." }) });
  load();
}
async function ref(id, where) {
  await fetch("/api/route/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ officer: who.gbv, log: who.gbv + " referred to " + where + "." }) });
  load();
}
setInterval(() => { if (Object.values(open).some(Boolean)) load(); }, 2000);
</script>
</body>
</html>
