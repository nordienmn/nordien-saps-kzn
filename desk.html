<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAPS KZN · Provincial desk</title>
<style>
  body { margin: 0; background: #0b1220; color: #e8eef8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #0a1730; border-bottom: 1px solid rgba(212,175,55,.5); }
  .brand { display: flex; gap: 10px; align-items: center; }
  .brand img { width: 46px; height: 46px; background: #fff; border-radius: 50%; }
  .brand b { letter-spacing: .08em; font-size: 13px; } .brand span, a { color: #93a4bd; font-size: 12px; }
  a { margin-left: 12px; color: #d4af37; }
  .body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px 24px; }
  .label { color: #d4af37; letter-spacing: .12em; font-size: 11px; text-transform: uppercase; }
  .card { background: #121c30; border: 1px solid rgba(255,255,255,.1); padding: 10px; margin: 8px 0; cursor: pointer; }
  .card.on { border-color: #d4af37; }
  .cas { font-family: Consolas, monospace; color: #d4af37; }
  h3 { margin: 4px 0; color: #e15b64; font-size: 16px; }
  .fine { color: #93a4bd; font-size: 13px; }
  .caller { display: flex; gap: 10px; align-items: center; }
  .caller img { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; }
  .window { margin-top: 10px; background: #000; border: 1px solid #d4af37; border-radius: 6px; min-height: 180px; display: flex; align-items: center; justify-content: center; position: relative; }
  .window video, .window img { width: 100%; max-height: 240px; object-fit: cover; }
  .live { position: absolute; top: 8px; left: 8px; background: #8f1d24; color: #fff; font-size: 12px; padding: 3px 6px; }
  button, select { font-family: inherit; }
  .answer { width: 100%; margin-top: 8px; border: 0; background: #1e4f9a; color: #fff; padding: 12px; font-weight: 700; }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .zone { border: 1px dashed #d4af37; border-radius: 8px; min-height: 54px; display: grid; place-items: center; color: #d4af37; font-size: 13px; font-weight: 700; }
  .zone.over { background: rgba(212,175,55,.15); }
  @media (max-width: 800px) { .body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand"><img alt="SAPS" src="/static/badge.png" /><div><b>SOUTH AFRICAN POLICE SERVICE</b><span id="shift">Sign in to take the shift</span></div></div>
  <div><a href="/headoffice">Head office</a><a href="/commissioner">Commissioner</a></div>
</header>
<div class="gate" id="gate" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;color:#1c1c1e;border-radius:16px;padding:20px;width:min(360px,92%)">
    <b>Sign in</b>
    <p>Choose your seat. Your ID is tagged to what you take.</p>
    <select id="seat" style="width:100%;padding:12px;margin:8px 0">
      <option value="operator">Operator</option>
      <option value="callcenter">Call center 1</option>
      <option value="tipoff">Tip-off line</option>
      <option value="gbv">GBV</option>
    </select>
    <input id="op" value="OP-12" style="width:100%;padding:12px;margin:8px 0" />
    <button type="button" onclick="enter()" style="width:100%;padding:12px">Enter shift</button>
  </div>
</div>
<div class="body">
  <p class="label">Move this file</p>
    <div class="zones">
      <div class="zone" data-desk="flying">Flying Squad</div>
      <div class="zone" data-desk="station">Station</div>
      <div class="zone" data-desk="fcs">FCS</div>
      <div class="zone" data-desk="hold">Hold</div>
    </div>
  <section>
    <p class="label">Case file</p>
    <div id="docket"></div>
  </section>
</div>
<script>
let reports = [], selected = null, officer = "", seat = "operator";
function enter() {
  seat = document.getElementById("seat").value;
  officer = document.getElementById("op").value.trim() || "OP-12";
  document.getElementById("gate").style.display = "none";
  const names = { operator: "Operator", callcenter: "Call center 1", tipoff: "Tip-off line", gbv: "GBV" };
  document.getElementById("shift").textContent = names[seat] + " · " + officer;
  load();
}
async function load() {
  const all = await (await fetch("/api/reports")).json();
  reports = all.filter(c => {
    if (seat === "tipoff") return c.kind === "tip";
    if (seat === "gbv") return c.label === "GBV" || c.label === "GBV SOS";
    return c.kind !== "tip" && c.kind !== "area" && c.label !== "GBV" && c.label !== "GBV SOS";
  });
  const board = document.getElementById("board");
  board.innerHTML = "";
  reports.forEach(c => {
    const el = document.createElement("div");
    el.className = "card" + (selected === c.id ? " on" : "");
    el.innerHTML = `<div class="cas">${c.cas}</div><h3>${c.kind === "tip" ? "TIP" : "FILE"} · ${c.label}</h3><div class="fine">${c.cluster} · ${c.named ? c.name : "no name"} · ${c.call || (c.kind === "tip" ? "tip" : "file")}</div>`;
    el.draggable = true;
    el.ondragstart = ev => ev.dataTransfer.setData("id", c.id);
    el.onclick = () => { selected = c.id; render(); };
    board.appendChild(el);
  });
  if (!selected && reports[0]) selected = reports[0].id;
  render();
}
function render() {
  const c = reports.find(x => x.id === selected);
  if (!c) return;
  const live = c.call === "incoming" || c.call === "live";
  document.getElementById("docket").innerHTML = `
    <div class="cas">${c.cas}</div>
    <h3>${c.label}</h3>
    <div class="caller"><img src="${c.face || "/static/face.jpg"}" alt="" /><div><b>${c.named ? c.name : "Name not stored"}</b><br>${c.mobile || "No callback"}<br>${c.address || c.cluster}</div></div>
    <p class="fine">${c.note || ""}</p>
    <div class="window" id="win">${live ? '<span class="live">LIVE CALL</span><img src="/static/face.jpg" alt="Control room and caller" /><div class="fine" style="position:absolute;bottom:8px;left:8px;right:8px;background:rgba(0,0,0,.6);padding:6px">Recording. Transcript writing into this file.</div>' : "No live call on this file."}</div>
    ${live ? '<button class="answer" onclick="answer()">Receive call on this file</button>' : ""}
    <div class="transcript"><b>Transcript on file</b><br>${c.transcript || "Waiting for the citizen to speak."}</div>
    <p class="fine">${(c.log || []).join("<br>")}</p>
    ${seat === "tipoff" ? '<button class="answer" onclick="escalate(\'headoffice\')">Escalate to head office</button><button class="answer" onclick="escalate(\'commissioner\')">Escalate to commissioner</button>' : ""}
    ${seat === "gbv" ? '<button class="answer" onclick="refer(\'hospital\')">Refer to hospital</button><button class="answer" onclick="refer(\'social worker\')">Refer to social worker</button><button class="answer" onclick="refer(\'rape kit and testing\')">Rape kit and testing</button><button class="answer" onclick="refer(\'shelter\')">Shelter</button><button class="answer" onclick="refer(\'transport\')">Transport</button>' : ""}`;
}
async function refer(where) {
  await fetch("/api/route/" + selected, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ officer, log: officer + " referred to " + where + "." }) });
  load();
}
async function escalate(desk) {
  await fetch("/api/route/" + selected, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ desk, officer, log: officer + " on tip-off line escalated to " + desk + "." }) });
  load();
}
async function answer() {
  await fetch("/api/route/" + selected, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ call: "received", officer, log: officer + " received the call on " + selected + "." }) });
  const win = document.getElementById("win");
  win.innerHTML = '<span class="live">RECEIVED</span><img src="/static/face.jpg" alt="Caller" />';
  load();
}
document.querySelectorAll(".zone").forEach(z => {
  z.ondragover = ev => { ev.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = async ev => {
    ev.preventDefault(); z.classList.remove("over");
    const id = ev.dataTransfer.getData("id") || selected;
    if (!id) return;
    await fetch("/api/route/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ desk: z.dataset.desk, officer, log: officer + " moved the file to " + z.dataset.desk + "." }) });
    load();
  };
});
load();
setInterval(load, 2000);
</script>
</body>
</html>
