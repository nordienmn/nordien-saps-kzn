<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAPS KZN · Desk</title>
<style>
  body { margin: 0; background: #0b1220; color: #e8eef8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #0a1730; border-bottom: 1px solid rgba(212,175,55,.5); }
  .brand { display: flex; gap: 10px; align-items: center; }
  .brand img { width: 42px; height: 42px; background: #fff; border-radius: 50%; }
  a { color: #d4af37; font-size: 13px; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 40px; }
  .card { background: #121c30; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 16px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  .fine { color: #93a4bd; font-size: 13px; }
  label { display: block; margin: 12px 0 6px; color: #d4af37; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  select, input, button { width: 100%; font-family: inherit; }
  select, input { padding: 12px; border: 0; border-radius: 10px; margin-bottom: 8px; }
  button { border: 0; background: #1e4f9a; color: #fff; padding: 12px; border-radius: 10px; font-weight: 700; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
  .kpi { background: #0b1220; border-radius: 10px; padding: 12px; }
  .kpi b { display: block; font-size: 22px; color: #d4af37; }
  .file { background: #0b1220; border-radius: 10px; padding: 10px; margin: 8px 0; }
  .cas { color: #d4af37; font-family: ui-monospace, monospace; font-size: 12px; }
  .hidden { display: none; }
  .bad { color: #e15b64; display: none; }
</style>
</head>
<body>
<header>
  <div class="brand"><img alt="SAPS" src="/static/badge.png" /><div><b>SOUTH AFRICAN POLICE SERVICE</b><div class="fine" id="who">Desk</div></div></div>
  <a href="/commissioner">Senior leadership</a>
</header>
<div class="wrap">
  <div class="card" id="dash">
    <h1>Desk</h1>
    <p class="fine">One window. Choose your door.</p>
    <div class="kpis">
      <div class="kpi"><b id="n-calls">0</b><span>Calls</span></div>
      <div class="kpi"><b id="n-crime">0</b><span>Crime reports</span></div>
      <div class="kpi"><b id="n-gbv">0</b><span>GBV</span></div>
      <div class="kpi"><b id="n-anon">0</b><span>Anonymous</span></div>
    </div>
    <label>Door</label>
    <select id="door">
      <option value="calls">Call operators</option>
      <option value="crime">Crime reporting</option>
      <option value="gbv">GBV</option>
      <option value="anon">Anonymous</option>
    </select>
    <label>Officer ID</label>
    <input id="op" value="OP-12" />
    <label>Password</label>
    <input id="pw" type="password" value="0000" />
    <p class="bad" id="bad">Password is 0000.</p>
    <button type="button" onclick="enter()">Enter</button>
  </div>
  <div class="card hidden" id="work">
    <button type="button" onclick="back()" style="width:auto;margin-bottom:10px">Back to desk</button>
    <h1 id="title">Door</h1>
    <div id="list"></div>
  </div>
</div>
<script>
let door = "calls", officer = "", all = [];
async function counts() {
  all = await (await fetch("/api/reports")).json();
  document.getElementById("n-calls").textContent = all.filter(c => c.label === "Voice call" || c.label === "Video call" || c.call).length;
  document.getElementById("n-crime").textContent = all.filter(c => c.kind !== "tip" && c.kind !== "area" && !["GBV","GBV SOS","Voice call","Video call"].includes(c.label)).length;
  document.getElementById("n-gbv").textContent = all.filter(c => c.label === "GBV" || c.label === "GBV SOS").length;
  document.getElementById("n-anon").textContent = all.filter(c => c.kind === "tip").length;
}
function enter() {
  if (document.getElementById("pw").value !== "0000") { document.getElementById("bad").style.display = "block"; return; }
  door = document.getElementById("door").value;
  officer = document.getElementById("op").value || "OP-12";
  const names = { calls: "Call operators", crime: "Crime reporting", gbv: "GBV", anon: "Anonymous" };
  document.getElementById("who").textContent = names[door] + " · " + officer;
  document.getElementById("title").textContent = names[door];
  document.getElementById("dash").classList.add("hidden");
  document.getElementById("work").classList.remove("hidden");
  show();
}
function back() {
  document.getElementById("work").classList.add("hidden");
  document.getElementById("dash").classList.remove("hidden");
  counts();
}
function mine() {
  if (door === "calls") return all.filter(c => c.label === "Voice call" || c.label === "Video call" || c.call);
  if (door === "gbv") return all.filter(c => c.label === "GBV" || c.label === "GBV SOS");
  if (door === "anon") return all.filter(c => c.kind === "tip");
  return all.filter(c => c.kind !== "tip" && c.kind !== "area" && !["GBV","GBV SOS","Voice call","Video call"].includes(c.label));
}
function show() {
  const items = mine();
  document.getElementById("list").innerHTML = items.length ? items.map(c => `<div class="file"><div class="cas">${c.cas}</div><b>${c.label}</b><div class="fine">${c.named ? c.name : "no name"} · ${c.address || c.cluster || ""}</div><div class="fine">${c.transcript || c.note || ""}</div>${door === "anon" ? `<button onclick="up('${c.id}')">Escalate to senior leadership</button>` : ""}${door === "gbv" ? `<button onclick="ref('${c.id}')">Refer</button>` : ""}</div>`).join("") : "<p class='fine'>Nothing in this door.</p>";
}
async function up(id) {
  await fetch("/api/route/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ desk: "commissioner", officer, log: officer + " escalated to senior leadership." }) });
  all = await (await fetch("/api/reports")).json();
  show();
}
async function ref(id) {
  await fetch("/api/route/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ officer, log: officer + " referred for GBV help." }) });
  all = await (await fetch("/api/reports")).json();
  show();
}
counts();
setInterval(() => { if (!document.getElementById("work").classList.contains("hidden")) { fetch("/api/reports").then(r => r.json()).then(d => { all = d; show(); }); } else counts(); }, 2000);
</script>
</body>
</html>
